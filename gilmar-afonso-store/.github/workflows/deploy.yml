# Publica a loja no GitHub Pages a cada push na branch main.
name: Deploy no GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      # O GitHub Pages não sabe que é um SPA: ao abrir /produto/x direto, ele procura o 404.html.
      # Uma cópia do index.html no lugar do 404 faz o React Router assumir e mostrar a página certa.
      - name: Preparar rotas do SPA
        run: cp dist/index.html dist/404.html

      - name: Configurar o Pages
        uses: actions/configure-pages@v6

      - name: Enviar o build
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
